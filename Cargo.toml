[package]
name = "ketchup-web"
version = "0.1.0"
edition = "2021"
description = "Landing page for Ketchup OS - a Rust/WASM site built with Yew, deployed to GitHub Pages."
license = "MIT"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"   # smallest wasm binary -> fastest first paint
lto = true
codegen-units = 1
panic = "abort"
