<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dceaff" />
  <meta name="description" content="Ketchup Linux — a fast, slim, Arch-based desktop operating system." />
  <title>Ketchup Linux — Fast. Sleek. Lightweight.</title>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <link data-trunk rel="icon" href="assets/logo-icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="splash" role="status" aria-label="Loading Ketchup">
    <img src="assets/splash.gif" alt="Ketchup" />
    <p>Loading Ketchup…</p>
  </div>

  <style>
    .splash {
      min-height: 100vh;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      background: #000;
      color: #eee;
      font: 14px monospace;
    }

    .splash img {
      width: min(380px, 90vw);
      height: auto;
    }

    .splash p {
      margin: 0;
    }
  </style>
</body>

</html>
