name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + trunk
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # The repository is "ketchup-web", so Pages serves this at
      # <user>.github.io/ketchup-web/; --public-url aligns Trunk's bundle links.
      # If you map a custom domain to the root, drop --public-url or set it to "/".
      - name: Build (release)
        run: trunk build --release --public-url /ketchup-web/

      # Images referenced by HTML embedded in the WASM bundle are invisible to
      # Trunk's asset scanner, so copy the source assets into the Pages artifact.
      - name: Copy static assets
        run: cp -R assets dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
